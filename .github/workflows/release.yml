name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0)'
        required: false
        default: 'dev'

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '20'
  WAILS_VERSION: 'latest'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building version: ${VERSION}"

  build-macos:
    needs: prepare
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install macOS dependencies
        run: |
          brew install portaudio whisper-cpp create-dmg

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build macOS App
        run: |
          wails build -platform darwin/arm64 -o "Yap"

      - name: Bundle macOS runtime libraries
        run: |
          set -euo pipefail
          APP="build/bin/Yap.app"
          mkdir -p "$APP/Contents/Frameworks" "$APP/Contents/Resources/bin" "$APP/Contents/Resources/lib" "$APP/Contents/Resources/libexec"

          cp /opt/homebrew/lib/libportaudio.2.dylib "$APP/Contents/Frameworks/"
          install_name_tool -change "/opt/homebrew/opt/portaudio/lib/libportaudio.2.dylib" \
            "@executable_path/../Frameworks/libportaudio.2.dylib" \
            "$APP/Contents/MacOS/Yap"

          cp /opt/homebrew/bin/whisper-cli "$APP/Contents/Resources/bin/"
          chmod +x "$APP/Contents/Resources/bin/whisper-cli"

          cp -L /opt/homebrew/opt/whisper-cpp/lib/libwhisper*.dylib "$APP/Contents/Resources/lib/"
          cp -L /opt/homebrew/opt/ggml/lib/libggml*.dylib "$APP/Contents/Resources/lib/"
          cp -L /opt/homebrew/opt/ggml/libexec/* "$APP/Contents/Resources/libexec/" || true

          for lib in "$APP/Contents/Resources/lib"/*.dylib; do
            install_name_tool -id "@executable_path/../lib/$(basename "$lib")" "$lib" || true
          done

          for bin in "$APP/Contents/Resources/bin/whisper-cli" "$APP/Contents/Resources/lib"/*.dylib "$APP/Contents/Resources/libexec"/*; do
            [ -f "$bin" ] || continue
            otool -L "$bin" | awk '/\/opt\/homebrew\/opt\/(whisper-cpp|ggml)\/lib\// {print $1}' | while read -r dep; do
              base="$(basename "$dep")"
              install_name_tool -change "$dep" "@loader_path/../lib/$base" "$bin" || true
            done
            otool -L "$bin" | awk '/@rpath\/libwhisper/ {print $1}' | while read -r dep; do
              base="$(basename "$dep")"
              install_name_tool -change "$dep" "@loader_path/../lib/$base" "$bin" || true
            done
          done

          codesign --force --deep --sign - "$APP"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Yap" \
            --volicon "build/appicon.icns" \
            --window-pos 200 120 \
            --window-size 600 340 \
            --icon-size 100 \
            --icon "Yap.app" 150 150 \
            --hide-extension "Yap.app" \
            --app-drop-link 450 150 \
            "Yap-${{ needs.prepare.outputs.version }}-macOS.dmg" \
            "build/bin/Yap.app" || true

          if [ ! -f "Yap-${{ needs.prepare.outputs.version }}-macOS.dmg" ]; then
            hdiutil create -volname "Yap" -srcfolder "build/bin/Yap.app" -ov -format UDZO "Yap-${{ needs.prepare.outputs.version }}-macOS.dmg"
          fi

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: Yap-${{ needs.prepare.outputs.version }}-macOS.dmg
          retention-days: 5

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install native dependencies via vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat
          C:\vcpkg\vcpkg install portaudio:x64-windows whisper-cpp:x64-windows
          echo "CGO_CFLAGS=-IC:/vcpkg/installed/x64-windows/include" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-LC:/vcpkg/installed/x64-windows/lib -lportaudio" >> $env:GITHUB_ENV
          echo "PKG_CONFIG_PATH=C:/vcpkg/installed/x64-windows/lib/pkgconfig" >> $env:GITHUB_ENV
          echo "C:/vcpkg/installed/x64-windows/bin" >> $env:GITHUB_PATH

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Copy Windows runtime dependencies
        run: |
          New-Item -ItemType Directory -Force -Path "build\bin\bin"
          Copy-Item "C:\vcpkg\installed\x64-windows\bin\portaudio.dll" -Destination "build\bin\"
          Copy-Item "C:\vcpkg\installed\x64-windows\tools\whisper-cpp\whisper-cli.exe" -Destination "build\bin\bin\" -ErrorAction SilentlyContinue
          if (-not (Test-Path "build\bin\bin\whisper-cli.exe")) {
            Get-ChildItem -Path "C:\vcpkg\installed\x64-windows" -Filter "whisper-cli.exe" -Recurse | Select-Object -First 1 | Copy-Item -Destination "build\bin\bin\whisper-cli.exe"
          }
          Get-ChildItem -Path "C:\vcpkg\installed\x64-windows\bin" -Filter "*.dll" | Where-Object { $_.Name -match "whisper|ggml|omp|openblas|blas" } | Copy-Item -Destination "build\bin\bin\" -ErrorAction SilentlyContinue

      - name: Build Windows App
        run: |
          wails build -platform windows/amd64 -nsis -o "Yap.exe"
        env:
          CGO_ENABLED: 1

      - name: Ensure runtime files are next to Windows app
        run: |
          New-Item -ItemType Directory -Force -Path "build\bin\bin"
          if (Test-Path "build\bin\Yap") {
            Copy-Item "build\bin\bin" -Destination "build\bin\Yap\bin" -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path "portable"
          Copy-Item "build\bin\Yap.exe" -Destination "portable\"
          Copy-Item "build\bin\portaudio.dll" -Destination "portable\" -ErrorAction SilentlyContinue
          Copy-Item "build\bin\bin" -Destination "portable\bin" -Recurse -Force
          Compress-Archive -Path "portable\*" -DestinationPath "Yap-${{ needs.prepare.outputs.version }}-Windows-Portable.zip" -Force

      - name: Rename installer
        run: |
          Move-Item -Path "build\bin\Yap-amd64-installer.exe" -Destination "Yap-${{ needs.prepare.outputs.version }}-Windows-Setup.exe" -ErrorAction SilentlyContinue
          if (-not (Test-Path "Yap-${{ needs.prepare.outputs.version }}-Windows-Setup.exe")) {
            Get-ChildItem -Path "build\bin" -Filter "*installer*.exe" | ForEach-Object {
              Move-Item -Path $_.FullName -Destination "Yap-${{ needs.prepare.outputs.version }}-Windows-Setup.exe"
            }
          }

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: Yap-${{ needs.prepare.outputs.version }}-Windows-Setup.exe
          retention-days: 5

      - name: Upload Windows Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: Yap-${{ needs.prepare.outputs.version }}-Windows-Portable.zip
          retention-days: 5

  build-linux-ubuntu22:
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev portaudio19-dev pkg-config libfuse2 fuse cmake git build-essential

      - name: Build whisper.cpp CLI
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper.cpp/build --config Release --target whisper-cli -j2

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Linux App
        run: |
          wails build -platform linux/amd64 -o "yap"

      - name: Create AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/yap AppDir/usr/bin/
          cp /tmp/whisper.cpp/build/bin/whisper-cli AppDir/usr/bin/
          chmod +x AppDir/usr/bin/yap AppDir/usr/bin/whisper-cli
          cp /usr/lib/x86_64-linux-gnu/libportaudio.so.2 AppDir/usr/lib/
          ldd AppDir/usr/bin/whisper-cli | awk '/=> \/.*(whisper|ggml|gomp|openblas|blas)/ {print $3}' | xargs -r -I{} cp -L {} AppDir/usr/lib/
          cat > AppDir/usr/share/applications/yap.desktop << EOF
          [Desktop Entry]
          Name=Yap
          Comment=Speech-to-Text Desktop App
          Exec=yap
          Icon=yap
          Type=Application
          Categories=Utility;Audio;
          EOF
          cp build/appicon.iconset/icon_256x256.png AppDir/usr/share/icons/hicolor/256x256/apps/yap.png
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/yap" "$@"
          EOF
          chmod +x AppDir/AppRun
          ln -sf usr/share/applications/yap.desktop AppDir/yap.desktop
          ln -sf usr/share/icons/hicolor/256x256/apps/yap.png AppDir/yap.png
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir "Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu22.AppImage"

      - name: Create DEB package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PKG_NAME="yap_${VERSION}_amd64"
          mkdir -p "${PKG_NAME}/DEBIAN" "${PKG_NAME}/usr/bin" "${PKG_NAME}/usr/share/applications" "${PKG_NAME}/usr/share/icons/hicolor/256x256/apps"
          cp build/bin/yap "${PKG_NAME}/usr/bin/"
          cp /tmp/whisper.cpp/build/bin/whisper-cli "${PKG_NAME}/usr/bin/"
          chmod +x "${PKG_NAME}/usr/bin/yap" "${PKG_NAME}/usr/bin/whisper-cli"
          cp build/appicon.iconset/icon_256x256.png "${PKG_NAME}/usr/share/icons/hicolor/256x256/apps/yap.png"
          cat > "${PKG_NAME}/usr/share/applications/yap.desktop" << EOF
          [Desktop Entry]
          Name=Yap
          Comment=Speech-to-Text Desktop App by applauselab.ai
          Exec=/usr/bin/yap
          Icon=yap
          Type=Application
          Categories=Utility;Audio;
          EOF
          cat > "${PKG_NAME}/DEBIAN/control" << EOF
          Package: yap
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.0-37, libportaudio2, libgomp1
          Maintainer: Applause Lab <hello@applauselab.ai>
          Description: Speech-to-Text Desktop App
           Yap is a speech-to-text desktop application powered by Whisper.
          EOF
          dpkg-deb --build "${PKG_NAME}"
          mv "${PKG_NAME}.deb" "Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu22.deb"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-ubuntu22
          path: Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu22.AppImage
          retention-days: 5

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-ubuntu22
          path: Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu22.deb
          retention-days: 5

  build-linux-ubuntu24:
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev portaudio19-dev pkg-config libfuse2 cmake git build-essential

      - name: Build whisper.cpp CLI
        run: |
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper.cpp
          cmake -S /tmp/whisper.cpp -B /tmp/whisper.cpp/build -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper.cpp/build --config Release --target whisper-cli -j2

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build Linux App
        run: |
          wails build -platform linux/amd64 -o "yap" -tags webkit2_41

      - name: Create AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ./appimagetool-x86_64.AppImage --appimage-extract
          mkdir -p AppDir/usr/bin AppDir/usr/lib AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp build/bin/yap AppDir/usr/bin/
          cp /tmp/whisper.cpp/build/bin/whisper-cli AppDir/usr/bin/
          chmod +x AppDir/usr/bin/yap AppDir/usr/bin/whisper-cli
          cp /usr/lib/x86_64-linux-gnu/libportaudio.so.2 AppDir/usr/lib/
          ldd AppDir/usr/bin/whisper-cli | awk '/=> \/.*(whisper|ggml|gomp|openblas|blas)/ {print $3}' | xargs -r -I{} cp -L {} AppDir/usr/lib/
          cat > AppDir/usr/share/applications/yap.desktop << EOF
          [Desktop Entry]
          Name=Yap
          Comment=Speech-to-Text Desktop App
          Exec=yap
          Icon=yap
          Type=Application
          Categories=Utility;Audio;
          EOF
          cp build/appicon.iconset/icon_256x256.png AppDir/usr/share/icons/hicolor/256x256/apps/yap.png
          cat > AppDir/AppRun << 'EOF'
          #!/bin/bash
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
          exec "${HERE}/usr/bin/yap" "$@"
          EOF
          chmod +x AppDir/AppRun
          ln -sf usr/share/applications/yap.desktop AppDir/yap.desktop
          ln -sf usr/share/icons/hicolor/256x256/apps/yap.png AppDir/yap.png
          ARCH=x86_64 ./squashfs-root/AppRun AppDir "Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu24.AppImage"

      - name: Create DEB package
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PKG_NAME="yap_${VERSION}_amd64"
          mkdir -p "${PKG_NAME}/DEBIAN" "${PKG_NAME}/usr/bin" "${PKG_NAME}/usr/share/applications" "${PKG_NAME}/usr/share/icons/hicolor/256x256/apps"
          cp build/bin/yap "${PKG_NAME}/usr/bin/"
          cp /tmp/whisper.cpp/build/bin/whisper-cli "${PKG_NAME}/usr/bin/"
          chmod +x "${PKG_NAME}/usr/bin/yap" "${PKG_NAME}/usr/bin/whisper-cli"
          cp build/appicon.iconset/icon_256x256.png "${PKG_NAME}/usr/share/icons/hicolor/256x256/apps/yap.png"
          cat > "${PKG_NAME}/usr/share/applications/yap.desktop" << EOF
          [Desktop Entry]
          Name=Yap
          Comment=Speech-to-Text Desktop App by applauselab.ai
          Exec=/usr/bin/yap
          Icon=yap
          Type=Application
          Categories=Utility;Audio;
          EOF
          cat > "${PKG_NAME}/DEBIAN/control" << EOF
          Package: yap
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: amd64
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0, libportaudio2, libgomp1
          Maintainer: Applause Lab <hello@applauselab.ai>
          Description: Speech-to-Text Desktop App
           Yap is a speech-to-text desktop application powered by Whisper.
          EOF
          dpkg-deb --build "${PKG_NAME}"
          mv "${PKG_NAME}.deb" "Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu24.deb"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-ubuntu24
          path: Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu24.AppImage
          retention-days: 5

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-ubuntu24
          path: Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu24.deb
          retention-days: 5

  release:
    needs: [prepare, build-macos, build-windows, build-linux-ubuntu22, build-linux-ubuntu24]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -type f -name "*" | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Yap ${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.version, 'dev') || contains(needs.prepare.outputs.version, 'beta') || contains(needs.prepare.outputs.version, 'alpha') }}
          generate_release_notes: true
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/windows-installer/*.exe
            artifacts/windows-portable/*.zip
            artifacts/linux-appimage-ubuntu22/*.AppImage
            artifacts/linux-deb-ubuntu22/*.deb
            artifacts/linux-appimage-ubuntu24/*.AppImage
            artifacts/linux-deb-ubuntu24/*.deb
          body: |
            ## Yap ${{ needs.prepare.outputs.version }}

            Speech-to-Text Desktop App by [Applause Lab](https://applauselab.ai)

            Local transcription runtime (`whisper-cli`) is bundled with release artifacts. Whisper model files are still downloaded on first setup into the user's Yap data directory.

            ### Downloads

            | Platform | Download |
            |----------|----------|
            | macOS (Apple Silicon, Intel via Rosetta) | `Yap-${{ needs.prepare.outputs.version }}-macOS.dmg` |
            | Windows Installer | `Yap-${{ needs.prepare.outputs.version }}-Windows-Setup.exe` |
            | Windows Portable | `Yap-${{ needs.prepare.outputs.version }}-Windows-Portable.zip` |
            | Linux (Ubuntu 22.04, Debian 11/12) | `Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu22.AppImage` or `.deb` |
            | Linux (Ubuntu 24.04+) | `Yap-${{ needs.prepare.outputs.version }}-Linux-ubuntu24.AppImage` or `.deb` |

            ### Installation

            **macOS:** Open the DMG, drag to Applications folder
            **Windows:** Run the installer
            **Linux (AppImage):** `chmod +x *.AppImage && ./Yap-*.AppImage`
            **Linux (DEB):** `sudo apt install ./Yap-*.deb`
